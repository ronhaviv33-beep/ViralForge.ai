# Render Blueprint for ViralForge.ai
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions a managed PostgreSQL database and a Next.js web service.
# After the first deploy, set the secret env vars (OpenAI / Stripe / AUTH_SECRET)
# in the Render dashboard, then run the database migration (see README).

databases:
  - name: viralforge-db
    databaseName: viralforge
    plan: free

services:
  - type: web
    name: viralforge
    runtime: node
    plan: free
    # `prisma migrate deploy` applies migrations on every deploy before build.
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: viralforge-db
          property: connectionString
      - key: DIRECT_URL
        # Required by Prisma for migrate deploy (bypasses PgBouncer advisory-lock limit).
        # If using Render's built-in DB: set to the same connection string as DATABASE_URL.
        # If using Neon: set to your Neon *direct* (non-pooled) connection string.
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CREATOR
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        # e.g. "ViralForge <noreply@yourdomain.com>" — must match a verified Resend sender domain.
        sync: false
      # Social integrations (optional — a platform without credentials shows as
      # "Coming soon" in the UI). Redirect URIs to register with each provider:
      #   {NEXT_PUBLIC_APP_URL}/api/integrations/instagram/callback
      #   {NEXT_PUBLIC_APP_URL}/api/integrations/youtube/callback
      #   {NEXT_PUBLIC_APP_URL}/api/integrations/tiktok/callback
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      # Encrypts stored social tokens at rest (falls back to AUTH_SECRET if unset).
      - key: SOCIAL_TOKEN_SECRET
        generateValue: true
