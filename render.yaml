# Render Blueprint for ViralForge.ai
# Docs: https://render.com/docs/blueprint-spec
#
# This provisions a managed PostgreSQL database and a Next.js web service.
# After the first deploy, set the secret env vars (OpenAI / Stripe / AUTH_SECRET)
# in the Render dashboard, then run the database migration (see README).

databases:
  - name: viralforge-db
    databaseName: viralforge
    plan: free

services:
  - type: web
    name: viralforge
    runtime: node
    plan: free
    # `prisma migrate deploy` applies migrations on every deploy before build.
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: viralforge-db
          property: connectionString
      - key: DIRECT_URL
        # Required by Prisma for migrate deploy (bypasses PgBouncer advisory-lock limit).
        # If using Render's built-in DB: set to the same connection string as DATABASE_URL.
        # If using Neon: set to your Neon *direct* (non-pooled) connection string.
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_CREATOR
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
